[workspace]
members = ["crates/tray-core", "crates/tray-windows"]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
async-trait = "0.1"
httpdate = "1"
native-tls = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "http2", "charset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time ={ version = "0.3", features = ["formatting", "macros", "parsing", "local-offset"] }
tokio = { version = "1", features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
zeroize = "1"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "debuginfo"
